name: Kiểm tra và đăng trang

# Chạy mỗi khi có thay đổi được đẩy lên nhánh main (hoặc bấm chạy tay trong tab Actions)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Kiểm tra code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kiểm tra cú pháp và cấu hình
        run: node scripts/check.mjs

  deploy:
    name: Đăng lên GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Gom file của trang
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -f firebase-config.txt ] && cp firebase-config.txt _site/ || true
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
